<!doctype html>
<html lang="fr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liste de tâches</title>
<script src="/runtime/es-runtime.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/jsx">
import { useEffect, useMemo, useState } from 'react';
import { Card, CardContent, CardDescription, CardFooter, CardHeader, CardTitle } from '@/components/ui/card';
import { Input } from '@/components/ui/input';
import { Button } from '@/components/ui/button';
import { Checkbox } from '@/components/ui/checkbox';
import { Badge } from '@/components/ui/badge';
import { Tabs, TabsList, TabsTrigger } from '@/components/ui/tabs';
import { Plus, Trash2, ListTodo } from 'lucide-react';
import { toast } from 'sonner';

type Task = { id: number; text: string; done: boolean };
const KEY = 'es-todo';
const loadTasks = (): Task[] => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };

export default function App() {
  const [tasks, setTasks] = useState<Task[]>(loadTasks);
  const [text, setText] = useState('');
  const [filter, setFilter] = useState('all');
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {} }, [tasks]);

  const add = () => {
    const t = text.trim();
    if (!t) return;
    setTasks([{ id: Date.now(), text: t, done: false }, ...tasks]);
    setText('');
  };
  const visible = useMemo(() => tasks.filter((t) => filter === 'all' || (filter === 'todo' ? !t.done : t.done)), [tasks, filter]);
  const left = tasks.filter((t) => !t.done).length;

  return (
    <div className="flex min-h-screen justify-center bg-background p-6">
      <Card className="w-full max-w-lg self-start">
        <CardHeader>
          <CardTitle className="flex items-center gap-2 text-xl"><ListTodo className="size-5 text-primary" />Liste de tâches</CardTitle>
          <CardDescription>{left} tâche{left > 1 ? 's' : ''} restante{left > 1 ? 's' : ''}</CardDescription>
        </CardHeader>
        <CardContent className="space-y-4">
          <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); add(); }}>
            <Input value={text} onChange={(e) => setText(e.target.value)} placeholder="Nouvelle tâche…" aria-label="Nouvelle tâche" />
            <Button type="submit"><Plus /> Ajouter</Button>
          </form>
          <Tabs value={filter} onValueChange={setFilter}>
            <TabsList className="w-full">
              <TabsTrigger value="all">Toutes</TabsTrigger>
              <TabsTrigger value="todo">À faire</TabsTrigger>
              <TabsTrigger value="done">Terminées</TabsTrigger>
            </TabsList>
          </Tabs>
          <ul className="space-y-2">
            {visible.length === 0 && <li className="py-6 text-center text-sm text-muted-foreground">Rien ici pour l'instant.</li>}
            {visible.map((t) => (
              <li key={t.id} className="flex items-center gap-3 rounded-lg border bg-muted/30 px-3 py-2">
                <Checkbox checked={t.done} onCheckedChange={(v) => setTasks(tasks.map((x) => (x.id === t.id ? { ...x, done: v === true } : x)))} aria-label="Terminée" />
                <span className={t.done ? 'flex-1 text-muted-foreground line-through' : 'flex-1'}>{t.text}</span>
                <Button variant="ghost" size="icon-sm" onClick={() => setTasks(tasks.filter((x) => x.id !== t.id))} aria-label="Supprimer"><Trash2 /></Button>
              </li>
            ))}
          </ul>
        </CardContent>
        <CardFooter className="justify-between">
          <Badge variant="secondary">{tasks.length} au total</Badge>
          <Button variant="outline" size="sm" disabled={!tasks.some((t) => t.done)}
            onClick={() => { setTasks(tasks.filter((t) => !t.done)); toast.success('Tâches terminées supprimées'); }}>
            Supprimer les terminées
          </Button>
        </CardFooter>
      </Card>
    </div>
  );
}
</script>
</body>
</html>
