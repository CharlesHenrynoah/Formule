<!doctype html>
<html lang="fr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script src="/runtime/es-runtime.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/jsx">
import { useState } from 'react';
import { Card, CardContent, CardDescription, CardFooter, CardHeader, CardTitle } from '@/components/ui/card';
import { Textarea } from '@/components/ui/textarea';
import { Button } from '@/components/ui/button';
import { Badge } from '@/components/ui/badge';
import { Sparkles, Plus, Trash2 } from 'lucide-react';
import { toast } from 'sonner';

export default function App() {
  const [text, setText] = useState('');
  const [items, setItems] = useState<string[]>([]);
  const [actions, setActions] = useState(0);
  const words = items.join(' ').split(/\s+/).filter(Boolean).length;
  const add = () => { if (!text.trim()) return; setItems([text.trim(), ...items]); setText(''); setActions(actions + 1); toast.success('Élément ajouté'); };
  return (
    <div className="flex min-h-screen justify-center bg-background p-6">
      <Card className="w-full max-w-xl self-start">
        <CardHeader>
          <CardTitle className="flex items-center gap-2 text-xl"><Sparkles className="size-5 text-primary" />{{TITLE}}</CardTitle>
          <CardDescription>Demande : « {{PROMPT}} »</CardDescription>
        </CardHeader>
        <CardContent className="space-y-3">
          <Textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Ajoutez un élément…" rows={3} />
          <div className="flex gap-2">
            <Button onClick={add}><Plus /> Ajouter</Button>
            <Button variant="outline" disabled={!items.length} onClick={() => { setItems([]); setActions(actions + 1); }}><Trash2 /> Vider</Button>
          </div>
          <ul className="space-y-2">{items.map((it, i) => <li key={i} className="rounded-lg border bg-muted/30 px-3 py-2 text-sm whitespace-pre-wrap">{it}</li>)}</ul>
        </CardContent>
        <CardFooter className="gap-2">
          <Badge variant="secondary">{items.length} éléments</Badge><Badge variant="secondary">{words} mots</Badge><Badge variant="secondary">{actions} actions</Badge>
          <span className="ml-auto text-xs text-muted-foreground">Mode démo : branchez Mercury 3 pour une app sur mesure</span>
        </CardFooter>
      </Card>
    </div>
  );
}
</script>
</body>
</html>
