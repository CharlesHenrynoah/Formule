<!doctype html>
<html lang="fr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculatrice</title>
<script src="/runtime/es-runtime.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/jsx">
import { useEffect, useState } from 'react';
import { Card, CardContent, CardHeader, CardTitle } from '@/components/ui/card';
import { Button } from '@/components/ui/button';
import { ScrollArea } from '@/components/ui/scroll-area';
import { Separator } from '@/components/ui/separator';
import { Calculator, Delete, History } from 'lucide-react';

// Évaluation sécurisée : analyseur récursif (+ − × ÷ %, parenthèses), sans eval.
function evaluate(expr: string): number {
  const s = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.');
  let i = 0;
  const peek = () => s[i];
  const num = (): number => {
    if (peek() === '(') { i++; const v = sum(); i++; return v; }
    if (peek() === '-') { i++; return -num(); }
    const m = /^\d*\.?\d+/.exec(s.slice(i));
    if (!m) throw new Error('expression invalide');
    i += m[0].length;
    let v = parseFloat(m[0]);
    if (peek() === '%') { i++; v = v / 100; }
    return v;
  };
  const prod = (): number => { let v = num(); while (peek() === '*' || peek() === '/') { const op = s[i++]; const r = num(); v = op === '*' ? v * r : v / r; } return v; };
  const sum = (): number => { let v = prod(); while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = prod(); v = op === '+' ? v + r : v - r; } return v; };
  const v = sum();
  if (i !== s.length || !isFinite(v)) throw new Error('expression invalide');
  return Math.round(v * 1e10) / 1e10;
}
const fmt = (n: number) => n.toLocaleString('fr-FR', { maximumFractionDigits: 10 });
const KEYS = ['C', '⌫', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', ',', '(', '='];

export default function App() {
  const [expr, setExpr] = useState('');
  const [history, setHistory] = useState<string[]>([]);
  let preview = '';
  try { preview = expr ? fmt(evaluate(expr)) : ''; } catch { preview = ''; }

  const press = (k: string) => {
    if (k === 'C') return setExpr('');
    if (k === '⌫') return setExpr((e) => e.slice(0, -1));
    if (k === '(') return setExpr((e) => e + ((e.split('(').length > e.split(')').length) && /[\d)]$/.test(e) ? ')' : '('));
    if (k === '=') {
      try { const r = evaluate(expr); setHistory((h) => [`${expr} = ${fmt(r)}`, ...h].slice(0, 20)); setExpr(String(r).replace('.', ',')); } catch { /* ignore */ }
      return;
    }
    setExpr((e) => e + k);
  };
  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      const map: Record<string, string> = { Enter: '=', '=': '=', Escape: 'C', Backspace: '⌫', '*': '×', '/': '÷', '-': '−', '.': ',' };
      const k = map[e.key] ?? e.key;
      if (/^[\d+%,()]$/.test(k) || KEYS.includes(k)) { e.preventDefault(); press(k === ')' ? '(' : k); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  return (
    <div className="flex min-h-screen flex-wrap items-start justify-center gap-4 bg-background p-6">
      <Card className="w-full max-w-xs">
        <CardHeader><CardTitle className="flex items-center gap-2"><Calculator className="size-5 text-primary" />Calculatrice</CardTitle></CardHeader>
        <CardContent className="space-y-3">
          <div className="rounded-lg border bg-muted/40 p-3 text-right">
            <div className="min-h-5 truncate font-mono text-sm text-muted-foreground">{expr || '0'}</div>
            <div className="truncate text-3xl font-semibold tabular-nums">{preview || '0'}</div>
          </div>
          <div className="grid grid-cols-4 gap-2">
            {KEYS.map((k) => (
              <Button key={k} size="lg" className="h-12 text-lg" variant={k === '=' ? 'default' : /[÷×−+%]/.test(k) ? 'secondary' : k === 'C' || k === '⌫' ? 'destructive' : 'outline'} onClick={() => press(k)}>
                {k === '⌫' ? <Delete /> : k === '(' ? '( )' : k}
              </Button>
            ))}
          </div>
        </CardContent>
      </Card>
      <Card className="w-full max-w-xs">
        <CardHeader><CardTitle className="flex items-center gap-2 text-base"><History className="size-4" />Historique</CardTitle></CardHeader>
        <CardContent>
          <ScrollArea className="h-64">
            {history.length === 0 && <p className="text-sm text-muted-foreground">Aucun calcul pour l'instant.</p>}
            {history.map((h, i) => (<div key={i}><div className="py-2 text-right font-mono text-sm">{h}</div><Separator /></div>))}
          </ScrollArea>
        </CardContent>
      </Card>
    </div>
  );
}
</script>
</body>
</html>
