server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api-gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;          # indispensable pour le streaming SSE
    proxy_cache off;
    proxy_read_timeout 600s;
  }
  # Voix (Google via voice-gateway) : WebSocket micro/audio + routes d'outils ; la clé reste côté serveur
  location /voice/ {
    proxy_pass http://voice-gateway:4006/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location /health { proxy_pass http://api-gateway:4000; }
  location /runtime/ { add_header Access-Control-Allow-Origin *; add_header Cache-Control "public, max-age=300"; }
  location / { try_files $uri /index.html; }
}
