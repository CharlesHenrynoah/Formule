# docker compose up --build  →  Studio sur http://localhost:4000
# Les services internes écoutent dans le conteneur ; seule la gateway est exposée.
services:
  formule:
    build: .
    ports: ["4000:4000"]
    env_file:
      - path: .env          # INCEPTION_API_KEY / OPENAI_API_KEY, Basic Auth… (facultatif)
        required: false
    environment:
      FORMULE_DATA_DIR: /data
      # Seule la gateway écoute sur toutes les interfaces ; les autres restent internes au conteneur.
      HOST: 127.0.0.1
      FORMULE_GATEWAY_HOST: 0.0.0.0
    volumes:
      - formule-data:/data   # SQLite, snapshots, secrets (chmod 600), configuration MCP
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  formule-data:
